[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evo-lang"
version = "0.3.0"
description = "Evolve Latin words into a synthetic Neo-Romance vocabulary with a genetic algorithm"
readme = "README.md"
license = "MIT"
authors = [{ name = "Filipe Carmo" }]
requires-python = ">=3.10"
keywords = ["genetic-algorithm", "historical-linguistics", "nlp", "latin", "romance-languages"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Real sentence embeddings for semantic drift (pulls in torch). Without it, a hash embedder is used.
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
evo-lang = "evo_lang.cli:main"

[project.urls]
Repository = "https://github.com/filipe-carmo/evo-lang"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_lang"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
